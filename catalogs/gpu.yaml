category: gpu
label: "Graphics cards"
currency: EUR

# Broad on purpose. The matcher does precision; the query only has to surface
# the ad. OLX search is fuzzy and forgiving, so fewer/wider terms = fewer
# requests = less chance of being rate-limited.
query_terms:
  - "rtx 5090"
  - "rtx 5080"
  - "rtx 5070"
  - "rtx 4090"
  - "rtx 4080"
  - "rtx 4070"
  - "rtx 3080"
  - "rtx 3070"
  - "rtx 3060"
  - "radeon 9070"
  - "radeon 7900"
  - "radeon 7800"
  - "rx 6800"
  - "placa grafica"

attributes:
  perf_index:
    label: "Relative performance (1440p raster, 5070 Ti = 100)"
    higher_is_better: true
  vram_gb:
    label: "VRAM (GB)"
    higher_is_better: true
  tdp_w:
    label: "Board power (W)"
    higher_is_better: false

rank_by: perf_index

modifiers:
  # ---- hard exclusions -------------------------------------------------
  - id: wanted_ad
    patterns: ['^procuro\b', '^compro\b', '^pago\b', '^wanted\b', '^busco\b']
    exclude: true
    note: "Buyers, not sellers. These poison the price distribution badly."

  - id: faulty
    patterns:
      ['para pecas', 'para peca', 'avariad', 'nao funciona', 'nao liga',
       'com defeito', 'defeituos', 'no funciona', 'averiad', 'sin funcionar',
       'artefact', 'so para pecas']
    exclude: true

  - id: whole_system
    patterns:
      ['pc completo', 'pc gaming completo', 'setup completo', 'torre completa',
       'computador completo', 'equipo completo', 'ordenador completo']
    exclude: true
    note: "Full builds need part-out valuation. Out of scope for now."

  - id: mining_rig
    patterns: ['rig de mineracao', 'mining rig', 'rig completo', 'lote de \d+']
    exclude: true

  - id: water_block_only
    patterns: ['^waterblock', '^bloco de agua', 'apenas o cooler', 'so o cooler',
               'backplate', 'suporte anti', 'suporte para placa']
    exclude: true
    note: "Accessories that match GPU model names but are not GPUs."

  # ---- price-normalizing modifiers -------------------------------------
  # Negative pct = listing carries extra value, so shave it off the asking
  # price to compare fairly against a bare unit.
  - id: warranty
    patterns: ['garantia', 'garantida', 'warranty', 'c/ gar', 'ainda com gar',
               'em garantia', 'con garantia']
    price_adjust_pct: -8

  - id: invoice
    patterns: ['fatura', 'factura', 'talao de compra', 'nota de compra',
               'com recibo', 'con factura']
    price_adjust_pct: -3

  - id: sealed_new
    patterns: ['selad', 'novo por abrir', 'nunca usad', 'lacrad', 'precintad',
               'a estrear', 'sem uso']
    price_adjust_pct: -12

  - id: boxed
    patterns: ['com caixa', 'na caixa', 'caixa original', 'con caja']
    price_adjust_pct: -2

  - id: mined_on
    patterns: ['usada para mineracao', 'minou', 'mineracao', 'mining',
               'undervolt 24/7']
    price_adjust_pct: 10

  - id: no_returns
    patterns: ['sem trocas', 'nao aceito trocas', 'nao troco', 'vendo como esta',
               'sem garantia']
    price_adjust_pct: 5

  - id: negotiable
    patterns: ['negociavel', 'aceito propostas', 'melhor oferta', 'negociable']
    price_adjust_pct: -4
    note: "Asking price overstates the real clearing price."

